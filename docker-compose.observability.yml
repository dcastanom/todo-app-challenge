# Observability stack — layer on top of docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up --build
#
# Prometheus  → http://localhost:9090
# Grafana     → http://localhost:3001  (admin / admin, dashboard "Todo Backend")
# Jaeger UI   → http://localhost:16686
# Loki        → http://localhost:3101  (queried from Grafana, not browsed directly)
services:
  backend:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: todo-backend

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      # Host-side only — offset to 3101 because some environments already
      # run a Loki on the default 3100. Promtail/Grafana talk to it over the
      # compose network on the container's own 3100, unaffected by this.
      - '3101:3100'
    volumes:
      - loki_data:/loki

  # Tails every container's stdout via the Docker socket and ships it to
  # Loki — no logging-driver plugin to install on the host, no per-service
  # log paths to maintain (see observability/promtail-config.yml).
  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  grafana_data:
  loki_data:
