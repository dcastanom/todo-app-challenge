name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todolist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todolist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todolist_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-0000000000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-000000000000000000000000000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:migrate --workspace backend
      - run: npm run db:seed --workspace backend
      - run: npm run db:verify --workspace backend
      # Full backend suite (unit + integration) with the >80% coverage gate,
      # plus the frontend coverage gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todolist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todolist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todolist_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-0000000000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-000000000000000000000000000
      CORS_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:migrate --workspace backend
      - run: npm run db:seed --workspace backend
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
