# Promtail auto-discovers every container via the Docker socket (read-only) —
# no per-service log paths to maintain, no Docker logging-driver plugin to
# install on the host. Ships everything to Loki; Grafana queries Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name (Docker prefixes it with "/") → a clean label.
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # docker-compose sets this label on every container it starts —
      # gives us {service="backend"} / {service="frontend"} / etc.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

    pipeline_stages:
      # Pino logs one JSON object per line in production (NODE_ENV=production,
      # see backend/src/config/logger.ts) — pull a few fields out so they're
      # queryable without re-parsing the whole line every time.
      - json:
          expressions:
            level: level
      - labels:
          level:
